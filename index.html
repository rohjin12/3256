<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>협력사업 신청 현황 · 한도 판정</title>
<style>
:root{--bg:#f3f1ec;--ink:#1c2528;--mut:#5d686b;--card:#fffdf9;--line:#dcd6c8;--ok:#1f7a4d;--okbg:#e6f4ec;--no:#b3261e;--nobg:#fbe9e7;--accent:#204e5e}
@media(prefers-color-scheme:dark){:root{--bg:#141a1c;--ink:#e8eeee;--mut:#9aa8aa;--card:#1c2528;--line:#2e3b3e;--okbg:#17301f;--nobg:#3a1c19;--ok:#6fd39b;--no:#ff8a80;--accent:#7cc4d8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.65rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:4px}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:210px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button:hover{background:var(--accent);color:var(--bg)}
.hint{font-size:.8rem;color:var(--mut);margin-top:8px}
.sum{display:flex;gap:18px;font-weight:700;margin:4px 0 12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);border-left:6px solid var(--ok);background:var(--okbg);border-radius:10px;padding:12px 14px}
.card.no{border-left-color:var(--no);background:var(--nobg)}
.card h3{margin:0 0 2px;font-size:1.05rem}
.card .biz{color:var(--mut);font-size:.9rem;min-height:2.6em}
.card .amt{margin-top:8px;font-size:.92rem}
.card .amt b{font-size:1.05rem}
.tag{display:inline-block;margin-top:8px;padding:2px 12px;border-radius:99px;color:#fff;background:var(--ok);font-size:.85rem;font-weight:700}
.card.no .tag{background:var(--no)}
h2{font-size:1.05rem;margin:28px 0 10px}
iframe{width:100%;height:460px;border:1px solid var(--line);border-radius:10px;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <h1>협력사업 신청 현황</h1>
  <p class="sub">지자체별 신청액을 한도액과 비교해 승인/반려를 자동 판정합니다.</p>

  <div class="panel">
    <div class="ctl">
      <label>공통 한도액(천원) — 비우면 지자체별 인구수×10(천원)이 한도
        <input id="limit" type="number" min="0" step="10000" placeholder="예: 600000">
      </label>
      <button id="reset" type="button">초기화</button>
    </div>
    <div class="hint">판정 규칙: 신청액 ≤ 한도액 → 승인(초록), 신청액 &gt; 한도액 → 반려(빨강). 기본 한도액 = 인구수 × 10(천원)</div>
  </div>

  <div class="sum" aria-live="polite"><span id="all"></span><span id="okc" style="color:var(--ok)"></span><span id="noc" style="color:var(--no)"></span></div>
  <div id="cards" class="grid"></div>

  <h2>신청 자료 핵심 정보 (Google Sheets)</h2>
  <iframe title="신청 자료 핵심 정보 - 지자체, 사업명, 예산" loading="lazy" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTzZjSmMy6Kh1EpYZZ0hmhDmfxLVDov1A7cZH-Maev0It84Tyf7NWB-b4yx_4N8VMo78pgY7q-sCUfQ/pubhtml?gid=573927076&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
</div>

<script id="fallback" type="application/json">[{"지자체명":"가람군","인구수":30000,"신청액":250000,"예산":250000,"사업명":"가람군 청년 농촌 정착 지원 사업"},{"지자체명":"나봄시","인구수":45000,"신청액":500000,"예산":500000,"사업명":"나봄시 스마트 관광 플랫폼 구축"},{"지자체명":"다솔구","인구수":80000,"신청액":600000,"예산":600000,"사업명":"다솔구 어르신 디지털 친화 도시 조성"},{"지자체명":"라윤시","인구수":60000,"신청액":700000,"예산":700000,"사업명":"라윤시 도심 보행자 안전망 구축"},{"지자체명":"마을군","인구수":25000,"신청액":200000,"예산":200000,"사업명":"마을군 지역화폐 활성화 사업"},{"지자체명":"바람시","인구수":100000,"신청액":950000,"예산":950000,"사업명":"바람시 친환경 에너지 전환 사업"},{"지자체명":"사계구","인구수":55000,"신청액":600000,"예산":600000,"사업명":"사계구 청소년 안심 귀가 시스템"},{"지자체명":"아현시","인구수":70000,"신청액":650000,"예산":650000,"사업명":"아현시 도시재생 거점공간 조성"},{"지자체명":"자연군","인구수":40000,"신청액":380000,"예산":380000,"사업명":"자연군 생태관광 마을 조성"},{"지자체명":"차돌시","인구수":90000,"신청액":880000,"예산":880000,"사업명":"차돌시 산업단지 디지털 전환 사업"}]</script>
<script>
const $ = id => document.getElementById(id);
const won = n => Number(n).toLocaleString("ko-KR");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DATA = [];

function render(){
  const g = $("limit").value.trim();
  const global = g === "" ? null : Number(g);
  let ok = 0;
  $("cards").innerHTML = DATA.map(d => {
    const limit = global ?? d["인구수"] * 10;
    const pass = d["신청액"] <= limit; if (pass) ok++;
    return `<article class="card ${pass ? "" : "no"}">
      <h3>${esc(d["지자체명"])}</h3>
      <div class="biz">${esc(d["사업명"])}</div>
      <div class="amt">예산(신청액) <b>${won(d["신청액"])}</b> 천원<br>한도액 ${won(limit)} 천원</div>
      <span class="tag">${pass ? "승인" : "반려"}</span></article>`;
  }).join("");
  $("all").textContent = `전체 ${DATA.length}건`;
  $("okc").textContent = `승인 ${ok}건`;
  $("noc").textContent = `반려 ${DATA.length - ok}건`;
}
$("limit").addEventListener("input", render);
$("reset").onclick = () => { $("limit").value = ""; render(); };

// 신청목록.json을 읽고, 파일 직접 열기(file://) 등으로 실패하면 내장 사본 사용
fetch("신청목록.json", {cache:"no-store"}).then(r => { if(!r.ok) throw 0; return r.json(); })
  .catch(() => JSON.parse($("fallback").textContent))
  .then(d => { DATA = d; render(); });
</script>
</body>
</html>
